[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eca-pp"
version = "0.3.2"
description = "Data curation tools for the Open Cell Atlas pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22",
    "scipy>=1.7",
    "h5py>=3.8",
    "anndata>=0.8",
    "stancounts>=0.3",
    "stangene>=0.5",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
llm = ["anthropic>=0.60"]
probe = ["scanpy>=1.10", "harmonypy>=0.0.9,<0.2", "scikit-learn>=1.1",
         "umap-learn>=0.5", "leidenalg>=0.10"]  # <0.2: classic numpy build, no torch
agent = ["claude-agent-sdk>=0.2", "anyio>=4.0"]
# 下期: doublets = ["scrublet"], gpu = ["scvi-tools"] …

[project.scripts]
eca-pp-standardize = "eca_pp.standardize.cli:cli"
eca-pp-integration-probe = "eca_pp.probe.cli:cli"
eca-pp-identify-columns = "eca_pp.identify_columns.cli:cli"

[project.urls]
Repository = "https://github.com/chansigit/eca-pp"

[tool.setuptools.packages.find]
where = ["src"]
